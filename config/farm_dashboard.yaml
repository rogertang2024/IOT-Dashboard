title: Smart Farm Operations
views:
  - title: Farm Overview
    icon: mdi:sprout
    path: default_view
    badges: []
    cards:
      # Zone 1: Soil Fertility & Field Mapping (Top)
      - type: iframe
        title: "🌾 Farm Soil Fertility & Field Mapping"
        url: /local/fertility_map.html?v=5
        aspect_ratio: 65%

      # Security Keypad & Operational Health Matrix
      - type: alarm-panel
        entity: alarm_control_panel.farm_security_system
        name: "🛡️ Farm Security Keypad (PIN: 1234)"
        states:
          - arm_home
          - arm_away

      - type: entities
        title: "🛡️ Security & Health Status Matrix"
        show_header_toggle: false
        entities:
          - entity: sensor.farm_security_health_status
            name: System Security Status
          - entity: binary_sensor.farm_node_connectivity
            name: ESP32 Hardware Link
          - entity: switch.farm_alarm_siren
            name: GPIO 23 Siren Buzzer
          - entity: binary_sensor.farm_pump_dry_run_risk
            name: Pump Dry-Run Risk
          - entity: binary_sensor.farm_freeze_risk
            name: Frost / Freeze Hazard

      # Zone 2: Microclimate, AQI & Barometric Pressure
      - type: weather-forecast
        entity: weather.home
        name: "🌦️ Farm Microclimate Forecast"
        show_current: true
        show_forecast: true
        forecast_type: daily

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.farm_air_quality_index
            name: Air Quality (AQI)
            min: 0
            max: 200
            severity:
              green: 0
              yellow: 50
              red: 100
          - type: gauge
            entity: sensor.farm_barometric_pressure
            name: Barometric Pressure
            needle: true
          - type: gauge
            entity: sensor.farm_pm2_5
            name: PM2.5 Dust
            min: 0
            max: 80
            severity:
              green: 0
              yellow: 35
              red: 55

      # Zone 3: Soil & Irrigation Control Station
      - type: entities
        title: "💧 Soil & Irrigation Station"
        show_header_toggle: false
        entities:
          - entity: switch.farm_water_pump
            name: Water Pump Relay
          - entity: sensor.farm_soil_moisture
            name: Soil Moisture
          - entity: sensor.farm_temperature
            name: Soil / Ambient Temperature
          - entity: binary_sensor.farm_water_level
            name: Water Reservoir Level
          - entity: binary_sensor.farm_light_level
            name: Sunlight Intensity (LDR)

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.farm_soil_moisture
            name: Soil Moisture
            min: 0
            max: 100
            severity:
              red: 20
              yellow: 40
              green: 60
          - type: gauge
            entity: sensor.farm_temperature
            name: Temperature
            min: 0
            max: 50
            severity:
              green: 18
              yellow: 28
              red: 35
          - type: button
            entity: switch.farm_water_pump
            name: Toggle Pump
            show_state: true
            icon: mdi:pump
            tap_action:
              action: toggle

      # 24-Hour Trends Graph
      - type: history-graph
        title: "📈 24-Hour Telemetry & Environmental Trends"
        hours_to_show: 24
        entities:
          - entity: sensor.farm_soil_moisture
            name: Soil Moisture (%)
          - entity: sensor.farm_temperature
            name: Temperature
          - entity: sensor.farm_barometric_pressure
            name: Barometric Pressure
          - entity: sensor.farm_air_quality_index
            name: Air Quality (AQI)

      # Zone 4: Wildlife & Security Camera
      - type: picture-entity
        title: "📹 Raspberry Pi Farm & Wildlife Camera"
        entity: camera.camera
        camera_view: live
        show_name: true
        show_state: false

      # Zone 5: Intruder Detection & Photograph Alert
      - type: markdown
        title: "📸 Latest Intruder Snapshot (Verified AI)"
        content: >
          <img src="/local/intruder_alert.jpg?t={{ as_timestamp(now()) }}" style="width:100%; border-radius: 8px; border: 2px solid #e53935;" />

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.farm_human_detected
            state: "on"
        card:
          type: markdown
          title: "🚨 INTRUDER ALERT — Active Alarm"
          content: >
            **Visual AI confirmed human presence at {{ state_attr('binary_sensor.farm_human_detected', 'timestamp') }}!**

            Confidence: {{ state_attr('binary_sensor.farm_human_detected', 'confidence') | float(0) * 100 | round(0) }}% | Physical Siren: ACTIVE

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.farm_human_detected
            state: "off"
        card:
          type: markdown
          title: "👁 Intruder Detection System"
          content: >
            ✅ **No human presence detected.**

            Visual AI camera monitoring is active. Any confirmed intruder will be photographed and alerted here with a bounding box.

      - type: glance
        title: "🔒 Security Sensor Matrix"
        entities:
          - entity: binary_sensor.farm_human_detected
            name: Human Detected
            icon: mdi:account-alert
          - entity: binary_sensor.farm_motion_detection
            name: Motion PIR
            icon: mdi:motion-sensor
          - entity: binary_sensor.farm_node_connectivity
            name: ESP32 Node
            icon: mdi:lan-connect
          - entity: switch.farm_alarm_siren
            name: Siren (GPIO 23)
            icon: mdi:bullhorn

      - type: entity
        entity: binary_sensor.farm_motion_detection
        name: Farm PIR Motion & Wildlife Activity
        icon: mdi:motion-sensor
