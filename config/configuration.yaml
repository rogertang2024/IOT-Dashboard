# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dedicated Smart Farm Dashboard in Sidebar
lovelace:
  dashboards:
    smart-farm:
      mode: yaml
      title: Smart Farm
      icon: mdi:sprout
      show_in_sidebar: true
      filename: farm_dashboard.yaml

# Smart Farm Alarm Control Panel (PIN: 1234)
alarm_control_panel:
  - platform: manual
    name: Farm Security System
    code: "1234"
    code_arm_required: false
    delay_time: 30
    trigger_time: 300
    disarmed:
      trigger_time: 0
    armed_home:
      delay_time: 0
    armed_away:
      delay_time: 30

# MQTT Smart Farm Entities
mqtt:
  sensor:
    - name: "Farm Temperature"
      state_topic: "farm/temp"
      unit_of_measurement: "°C"
      device_class: "temperature"
      state_class: "measurement"
      unique_id: "farm_temp"

    - name: "Farm Soil Moisture"
      state_topic: "farm/soil"
      unit_of_measurement: "%"
      icon: "mdi:watering-can"
      state_class: "measurement"
      unique_id: "farm_soil"

  binary_sensor:
    - name: "Farm Motion Detection"
      state_topic: "farm/pir"
      payload_on: "1"
      payload_off: "0"
      device_class: "motion"
      unique_id: "farm_pir"

    - name: "Farm Water Level"
      state_topic: "farm/water"
      payload_on: "1"
      payload_off: "0"
      device_class: "moisture"
      unique_id: "farm_water"

    - name: "Farm Light Level"
      state_topic: "farm/ldr"
      payload_on: "1"
      payload_off: "0"
      device_class: "light"
      unique_id: "farm_ldr"

    - name: "Farm Node Connectivity"
      state_topic: "farm/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: "connectivity"
      unique_id: "farm_node_connectivity"

    - name: "Farm Human Detected"
      state_topic: "farm/security/human_detected"
      value_template: "{{ value_json.state }}"
      json_attributes_topic: "farm/security/human_detected"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: "safety"
      icon: "mdi:account-alert"
      unique_id: "farm_human_detected"

  switch:
    - name: "Farm Water Pump"
      state_topic: "farm/pump/state"
      command_topic: "farm/pump"
      payload_on: "ON"
      payload_off: "OFF"
      icon: "mdi:pump"
      unique_id: "farm_pump"

    - name: "Farm Alarm Siren"
      state_topic: "farm/alarm/siren/state"
      command_topic: "farm/alarm/siren"
      payload_on: "ON"
      payload_off: "OFF"
      optimistic: true
      icon: "mdi:bullhorn"
      unique_id: "farm_alarm_siren"

# Live Meteorological & Air Quality Sensors (Open-Meteo)
rest:
  - resource: "https://api.open-meteo.com/v1/forecast?latitude=39.9719&longitude=-86.2106&current=surface_pressure"
    scan_interval: 600
    sensor:
      - name: "Farm Barometric Pressure"
        value_template: "{{ value_json.current.surface_pressure }}"
        unit_of_measurement: "hPa"
        device_class: "atmospheric_pressure"
        state_class: "measurement"
        unique_id: "farm_barometric_pressure"

  - resource: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=39.9719&longitude=-86.2106&current=us_aqi,pm2_5"
    scan_interval: 600
    sensor:
      - name: "Farm Air Quality Index"
        value_template: "{{ value_json.current.us_aqi }}"
        device_class: "aqi"
        state_class: "measurement"
        unique_id: "farm_air_quality_index"

      - name: "Farm PM2.5"
        value_template: "{{ value_json.current.pm2_5 }}"
        unit_of_measurement: "µg/m³"
        device_class: "pm25"
        state_class: "measurement"
        unique_id: "farm_pm2_5"

# Safety & Health Template Sensors
template:
  - binary_sensor:
      - name: "Farm Pump Dry-Run Risk"
        state: "{{ is_state('switch.farm_water_pump', 'on') and is_state('binary_sensor.farm_water_level', 'off') }}"
        device_class: "problem"
        unique_id: "farm_pump_dry_run_risk"

      - name: "Farm Freeze Risk"
        state: "{{ states('sensor.farm_temperature') | float(20) <= 2.0 }}"
        device_class: "cold"
        unique_id: "farm_freeze_risk"

    sensor:
      - name: "Farm Security & Health Status"
        unique_id: "farm_security_health_status"
        icon: "mdi:shield-check"
        state: >
          {% if is_state('alarm_control_panel.farm_security_system', 'triggered') %}
            Perimeter Intrusion Detected!
          {% elif is_state('binary_sensor.farm_node_connectivity', 'off') %}
            Farm Node Offline
          {% elif is_state('binary_sensor.farm_pump_dry_run_risk', 'on') %}
            Dry-Run Hazard: Water Depleted!
          {% elif is_state('binary_sensor.farm_freeze_risk', 'on') %}
            Freeze Warning (< 2°C)
          {% elif is_state('alarm_control_panel.farm_security_system', 'armed_away') %}
            Armed Away - Full Perimeter Guard
          {% elif is_state('alarm_control_panel.farm_security_system', 'armed_home') %}
            Armed Home - Safety Guard Active
          {% else %}
            All Systems Normal (Disarmed)
          {% endif %}
